[project]
name = "thespis"
version = "0.1.0"
description = "Thespis: an AI/ML toolkit for game developers. First module: Thespis Cast (NPC minds)."
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "client"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/crypt_road_sim.py" = ["E701", "E702"]
