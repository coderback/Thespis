[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# The package is the core alone (thespis/): the games, Rehearsal, tools and client stay in the repo. Versions follow
# semver at 0.x: a minor release may change anything outside thespis.api and /v1; those change only with a note.
[project]
name = "thespis"
dynamic = ["version"]
description = "Thespis: an AI/ML toolkit for game developers. First module: Thespis Cast (NPC minds)."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]  # python -m thespis serve: the /v1 API

[project.scripts]
thespis = "thespis.__main__:main"

[tool.hatch.version]
path = "thespis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["thespis"]

[tool.hatch.build.targets.sdist]
include = ["thespis", "README.md", "LICENSE", "docs/openapi-v1.json", "examples/tavern"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "client"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/crypt_road_sim.py" = ["E701", "E702"]

[tool.pyright]
include = ["thespis", "games", "tools", "examples", "rehearsal"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
