name: Task
description: A piece of work with a clear done-when check
labels: ["type:task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["core (thespis/)", "/v1 and the engine SDKs", "examples and docs", "demo games", "tooling and CI"]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this achieves and why.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      value: |
        - [ ] 
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A check anyone can run to confirm it is finished.
    validations:
      required: true
