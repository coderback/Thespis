name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements-dev.txt
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.14"
      - name: Lock files match their inputs
        run: |
          uv pip compile requirements.in --universal --generate-hashes --python-version 3.12 -o requirements.txt
          uv pip compile requirements-dev.in --universal --generate-hashes --python-version 3.12 -o requirements-dev.txt
          git diff --exit-code requirements.txt requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Types
        run: pyright
      - name: Test
        run: pytest -q

  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint, test and build (if the client has a package.json)
        shell: bash
        run: |
          if [ ! -f client/package.json ]; then
            echo "No client/package.json yet; nothing to check."
            exit 0
          fi
          cd client
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present

  # The image Railway deploys: built, then run with a volume as Railway runs it.
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t thespis:ci .
      - name: Runs as non-root, logs JSON, keeps its volume
        run: sh scripts/check-image.sh thespis:ci

  # The single required check for main. Do not rename without updating the ruleset.
  ci:
    name: ci
    if: always()
    needs: [engine, client, image]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        shell: bash
        run: |
          results="engine=${{ needs.engine.result }} client=${{ needs.client.result }} image=${{ needs.image.result }}"
          for result in $results; do
            if [ "${result#*=}" != "success" ]; then
              echo "$results"
              exit 1
            fi
          done
