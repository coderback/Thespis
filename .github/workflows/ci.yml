name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    services:
      postgres:  # the storage tests run on SQLite and on this
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: thespis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      THESPIS_TEST_POSTGRES: postgresql://postgres:ci@127.0.0.1:5432/thespis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements-dev.txt
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.14"
      - name: Lock files match their inputs
        run: |
          uv pip compile requirements.in --universal --generate-hashes --python-version 3.12 -o requirements.txt
          uv pip compile requirements-server.in --universal --generate-hashes --python-version 3.12 -o requirements-server.txt
          uv pip compile requirements-dev.in --universal --generate-hashes --python-version 3.12 -o requirements-dev.txt
          git diff --exit-code requirements.txt requirements-server.txt requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Types
        run: pyright
      - name: Test
        run: pytest -q

  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint, test and build (if the client has a package.json)
        shell: bash
        run: |
          if [ ! -f client/package.json ]; then
            echo "No client/package.json yet; nothing to check."
            exit 0
          fi
          cd client
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present

  # The image Railway deploys: built, then run with a volume as Railway runs it.
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t thespis:ci .
      - name: Runs as non-root, logs JSON, keeps its volume
        run: sh scripts/check-image.sh thespis:ci

  # The hosted runtime's image, run beside Postgres as a host would.
  serve-image:
    name: serve-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f docker/serve.Dockerfile -t thespis-serve:ci .
      - name: Wants a key, keeps sessions in Postgres across a restart, runs as non-root
        run: sh scripts/check-serve-image.sh thespis-serve:ci

  # The runtime a game ships beside it, on each platform: built, held to its size and cold-start budgets, played.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3
      - name: Build, check budgets, play a turn
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: thespis-${{ matrix.os }}
          path: dist/thespis-*.zip
          retention-days: 14

  # The server under engines playing at once, on Postgres (docs/serve.md has the full-size run).
  load:
    name: load
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: thespis_load
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements-server.txt
      - name: 100 engines at once, p95 within budget, no errors
        run: python tools/loadtest.py --players 100 --rounds 2 --think 2 --db postgresql://postgres:ci@127.0.0.1:5432/thespis_load

  # The Godot addon's example, headless, against a sidecar the addon starts and a hosted-mode server (sdk/godot).
  godot:
    name: godot
    runs-on: ubuntu-latest
    env:
      GODOT_ZIP: Godot_v4.7.2-stable_linux.x86_64.zip
      GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements-server.txt
      - name: Godot 4.7.2, checked against its published SHA-512
        run: |
          curl -fsSLo "$RUNNER_TEMP/$GODOT_ZIP" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$GODOT_ZIP"
          echo "$GODOT_SHA512  $RUNNER_TEMP/$GODOT_ZIP" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/$GODOT_ZIP" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: The example plays through a sidecar and a server, unchanged
        run: python sdk/godot/test/run.py

  # The Unity package's core and example under .NET, against a sidecar and a hosted-mode server (sdk/unity). The
  # scene itself plays in the Unity editor, which needs a licence: run sdk/unity/test/run.py --unity locally.
  unity:
    name: unity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install
        run: pip install -r requirements-server.txt
      - name: The Lantern plays through a sidecar and a server, unchanged
        run: python sdk/unity/test/run.py --runner dotnet

  # The single required check for main. Do not rename without updating the ruleset.
  ci:
    name: ci
    if: always()
    needs: [engine, client, image, serve-image, package, load, godot, unity]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        shell: bash
        run: |
          results="engine=${{ needs.engine.result }} client=${{ needs.client.result }} image=${{ needs.image.result }}"
          results="$results serve-image=${{ needs.serve-image.result }} package=${{ needs.package.result }}"
          results="$results load=${{ needs.load.result }} godot=${{ needs.godot.result }}"
          results="$results unity=${{ needs.unity.result }}"
          for result in $results; do
            if [ "${result#*=}" != "success" ]; then
              echo "$results"
              exit 1
            fi
          done
