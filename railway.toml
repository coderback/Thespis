# Railway build and deploy settings. The volume itself is added in the dashboard, mounted at /data.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
# SQLite lives on one volume, so there must only ever be one replica.
numReplicas = 1
