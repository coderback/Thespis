  { call = "narrate", since = 0 },
]

[[scenario]]
name = "nothing_has_happened"
steps = [
  { call = "react", npc = "garrick", trigger = "talk" },
  { call = "decide", npc = "garrick", moment = "turn" },
  { call = "react", npc = "pip", trigger = "talk" },
]
