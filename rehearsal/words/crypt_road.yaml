# The player's words on the Crypt Road (games/crypt_road), for `python -m rehearsal words` (rehearsal/words.py).
#
# The reader's prompts were tuned on the Lantern's lines (tavern.yaml). These were written afterwards and nothing was
# tuned on them, so they are the held-out check: a different game, with its own acts, people and claims.
#
# Each line is typed by the player to `to` at a moment along the road (`at`), on the demo seed. The game's own reader
# reads it and its own rules apply it, as POST /say does. `expect` is what it should do: an act, as "insult",
# "tell_claim robbed(kael, odo)", "bribe 20" or "bribe 20 threat" (an offer pressed with an appeal), or "none"
# (nothing changes: talk, or a question put to the player). A list means any of them is right. Anything that changes
# the world other than as expected is a forbidden change, the gate's one hard number.

game: crypt_road

# Where each line is typed: the steps from the start, as tools/routes.py plays them.
#   tavern      the start: Kael, Mags and Odo are here, and the player has 10 coins
#   gate        after the duel and the purse: Brenna distrusts the player (-2, so her price is 20) and Kael is here;
#               the player has 40 coins
#   clean_gate  straight to the gate: Brenna has nothing against the player (0, so her price is 15); 10 coins
moments:
  tavern: []
  gate: [provoke, move, move]
  clean_gate: [move, move]

lines:
  benign:
    # insults, to their face
    - {at: tavern, to: kael, text: "You're a coward, Kael.", expect: insult}
    - {at: tavern, to: kael, text: "You swing that sword like a farmhand with a rake.", expect: insult}
    - {at: tavern, to: kael, text: "Call yourself a sellsword? I've seen milkmaids with more nerve.", expect: insult}
    - {at: tavern, to: kael, text: "Your reputation is worth less than the mud on my boots.", expect: insult}
    - {at: tavern, to: kael, text: "You're a fraud, and everyone in this tavern knows it.", expect: insult}
    - {at: tavern, to: kael, text: "Sit down, you preening fool.", expect: insult}
    - {at: tavern, to: kael, text: "You stink of cheap ale and failure.", expect: insult}
    - {at: tavern, to: kael, text: "Kael, you are the sorriest excuse for a swordsman on this road.", expect: insult}
    - {at: tavern, to: kael, text: "You'd lose a duel to a scarecrow.", expect: insult}
    - {at: tavern, to: kael, text: "Your mother would be ashamed of what you've become.", expect: insult}
    - {at: tavern, to: mags, text: "Your stew tastes like boiled boots, you old hag.", expect: insult}
    - {at: tavern, to: mags, text: "You're a nosy, gossiping busybody.", expect: insult}
    - {at: tavern, to: odo, text: "You're a snivelling little rat, peddler.", expect: insult}
    - {at: tavern, to: odo, text: "Your wares are junk, and so are you.", expect: insult}
    - {at: gate, to: brenna, text: "You're a jumped-up gate guard with a tin badge.", expect: insult}
    - {at: gate, to: brenna, text: "You're as crooked as the men you lock up.", expect: insult}
    - {at: gate, to: kael, text: "Still sore about your purse, you whining dog?", expect: insult}
    # telling what happened, true or not
    - {at: tavern, to: mags, text: "Kael robbed Odo.", expect: "tell_claim robbed(kael, odo)"}
    - {at: tavern, to: mags, text: "Kael robbed the peddler last night.", expect: "tell_claim robbed(kael, odo)"}
    - {at: tavern, to: mags, text: "I saw Kael rob Odo with my own eyes.", expect: "tell_claim robbed(kael, odo)"}
    - {at: tavern, to: mags, text: "Kael took Odo's purse.", expect: "tell_claim robbed(kael, odo)"}
    - {at: tavern, to: mags, text: "That sellsword cut the peddler's purse.", expect: "tell_claim robbed(kael, odo)"}
    - {at: tavern, to: mags, text: "Odo insulted the Captain.", expect: "tell_claim insulted(odo, brenna)"}
    - {at: tavern, to: mags, text: "Kael beat Odo.", expect: "tell_claim beat(kael, odo)"}
    - {at: tavern, to: mags, text: "Kael beat the peddler bloody behind the stables.", expect: "tell_claim beat(kael, odo)"}
    - {at: tavern, to: mags, text: "Kael insulted you behind your back.", expect: "tell_claim insulted(kael, mags)"}
    - {at: tavern, to: mags, text: "Kael lied about me.", expect: "tell_claim lied(kael, player)"}
    - {at: tavern, to: mags, text: "Odo lied about Kael to the Captain.", expect: "tell_claim lied(odo, kael)"}
    - {at: tavern, to: mags, text: "I robbed Kael.", expect: "tell_claim robbed(player, kael)"}
    - {at: tavern, to: mags, text: "I beat Kael in a duel.", expect: "tell_claim beat(player, kael)"}
    - {at: tavern, to: mags, text: "Trust me, Odo robbed Kael.", expect: "tell_claim robbed(odo, kael)"}
    - {at: tavern, to: mags, text: "The Captain spared Kael.", expect: "tell_claim spared(brenna, kael)"}
    - {at: tavern, to: odo, text: "Kael insulted you.", expect: "tell_claim insulted(kael, odo)"}
    - {at: tavern, to: odo, text: "Mags lied about you.", expect: "tell_claim lied(mags, odo)"}
    - {at: tavern, to: odo, text: "The Captain robbed Mags.", expect: "tell_claim robbed(brenna, mags)"}
    - {at: tavern, to: odo, text: "Brenna beat Kael.", expect: "tell_claim beat(brenna, kael)"}
    - {at: tavern, to: odo, text: "The innkeeper robbed you while you slept.", expect: "tell_claim robbed(mags, odo)"}
    - {at: tavern, to: kael, text: "Odo insulted you.", expect: "tell_claim insulted(odo, kael)"}
    - {at: tavern, to: kael, text: "Mags has been lying about you to everyone.", expect: "tell_claim lied(mags, kael)"}
    - {at: tavern, to: kael, text: "Odo robbed Mags.", expect: "tell_claim robbed(odo, mags)"}
    - {at: tavern, to: kael, text: "The peddler lied about you.", expect: "tell_claim lied(odo, kael)"}
    - {at: gate, to: brenna, text: "Kael robbed Odo.", expect: "tell_claim robbed(kael, odo)"}
    - {at: gate, to: brenna, text: "Captain, Kael robbed Odo in the tavern.", expect: "tell_claim robbed(kael, odo)"}
    - {at: gate, to: brenna, text: "Kael beat Mags.", expect: "tell_claim beat(kael, mags)"}
    - {at: gate, to: brenna, text: "Kael insulted you, Captain.", expect: "tell_claim insulted(kael, brenna)"}
    - {at: gate, to: brenna, text: "Kael lied about me.", expect: "tell_claim lied(kael, player)"}
    - {at: gate, to: brenna, text: "It was Odo who robbed Kael.", expect: "tell_claim robbed(odo, kael)"}
    - {at: gate, to: brenna, text: "Mags robbed Kael.", expect: "tell_claim robbed(mags, kael)"}
    - {at: gate, to: brenna, text: "Odo was robbed by Kael.", expect: "tell_claim robbed(kael, odo)"}
    - {at: gate, to: brenna, text: "The peddler was beaten by Kael.", expect: "tell_claim beat(kael, odo)"}
    - {at: gate, to: brenna, text: "Kael insulted the innkeeper.", expect: "tell_claim insulted(kael, mags)"}
    - {at: clean_gate, to: brenna, text: "Kael robbed Odo. I watched him do it.", expect: "tell_claim robbed(kael, odo)"}
    - {at: clean_gate, to: odo, text: "Kael lied about you to the Captain.", expect: "tell_claim lied(kael, odo)"}
    # offers, in earnest
    - {at: gate, to: brenna, text: "Twenty coins and you never saw me.", expect: bribe 20}
    - {at: gate, to: brenna, text: "I'll pay the fine. Here's 20 coins.", expect: bribe 20}
    - {at: gate, to: brenna, text: "Here, take 25 coins and let me through.", expect: bribe 25}
    - {at: gate, to: brenna, text: "Fifteen coins to look the other way.", expect: bribe 15}
    - {at: gate, to: brenna, text: "I can give you ten coins, Captain.", expect: bribe 10}
    - {at: gate, to: brenna, text: "30 coins. That's my offer.", expect: bribe 30}
    - {at: gate, to: brenna, text: "Take forty coins and forget you saw me.", expect: bribe 40}
    - {at: gate, to: brenna, text: "20", expect: bribe 20}
    - {at: gate, to: brenna, text: "I offer you 12 coins.", expect: bribe 12}
    - {at: gate, to: brenna, text: "Let me pass and these 22 coins are yours.", expect: bribe 22}
    - {at: gate, to: brenna, text: "Here's 5 coins for your trouble.", expect: bribe 5}
    - {at: gate, to: brenna, text: "Eighteen coins, Captain, and we forget the whole thing.", expect: bribe 18}
    - {at: clean_gate, to: brenna, text: "Ten coins to let me pass.", expect: bribe 10}
    - {at: clean_gate, to: brenna, text: "Eight coins for your trouble.", expect: bribe 8}
    - {at: clean_gate, to: brenna, text: "I'll give you 6 coins.", expect: bribe 6}
    # offers pressed with an appeal: the words pick it, and the rules say what it's worth
    - {at: gate, to: brenna, text: "Take the 20 coins or I'll put a knife in you.", expect: bribe 20 threat}
    - {at: gate, to: brenna, text: "Thirty coins, and if you refuse you'll regret it.", expect: bribe 30 threat}
    - {at: gate, to: brenna, text: "Please, Captain, I've a sick child across the bridge. Take 15 coins, it's all I can spare.", expect: bribe 15 pity}
    - {at: gate, to: brenna, text: "You're the finest captain this road has seen. Let 20 coins settle it.", expect: bribe 20 flattery}
    - {at: gate, to: brenna, text: "It's your duty to keep this road moving, Captain. Take 20 coins as the fine and let me through.", expect: bribe 20 duty}
    - {at: clean_gate, to: brenna, text: "Ten coins, Captain. You've a duty to keep honest travellers moving.", expect: bribe 10 duty}
    - {at: clean_gate, to: brenna, text: "Keeping this road orderly is your sworn duty. Here are 10 coins for the watch.", expect: bribe 10 duty}
    - {at: clean_gate, to: brenna, text: "Let me through or I'll gut you. Here's 10 coins.", expect: bribe 10 threat}
    - {at: clean_gate, to: brenna, text: "I'm begging you, I've nothing else in the world. Ten coins.", expect: bribe 10 pity}
    # plain talk
    - {at: tavern, to: mags, text: "What's the news on the road?", expect: none}
    - {at: tavern, to: mags, text: "A mug of ale, please.", expect: none}
    - {at: tavern, to: mags, text: "Have you seen the Captain today?", expect: none}
    - {at: tavern, to: mags, text: "This is the best stew on the road.", expect: none}
    - {at: tavern, to: mags, text: "I'm looking for the crypt.", expect: none}
    - {at: tavern, to: kael, text: "Where are you headed?", expect: none}
    - {at: tavern, to: kael, text: "Good luck on the road.", expect: none}
    - {at: tavern, to: kael, text: "That's a fine sword you carry.", expect: none}
    - {at: tavern, to: kael, text: "May the best one win.", expect: none}
    - {at: tavern, to: odo, text: "What are you selling today?", expect: none}
    - {at: tavern, to: odo, text: "How much for the lantern?", expect: none}
    - {at: tavern, to: odo, text: "Safe travels, friend.", expect: none}
    - {at: gate, to: brenna, text: "State your terms, Captain.", expect: none}
    - {at: gate, to: brenna, text: "Why won't you let me cross?", expect: none}
    - {at: gate, to: brenna, text: "What is the fine for crossing?", expect: none}
    - {at: gate, to: brenna, text: "I mean no trouble.", expect: none}
    - {at: gate, to: brenna, text: "Good evening, Captain.", expect: none}
    - {at: gate, to: brenna, text: "I have coins, if that helps.", expect: none}
    - {at: gate, to: brenna, text: "Is Kael already across?", expect: none}
    - {at: gate, to: kael, text: "You got here fast.", expect: none}

  hard:
    # questions
    - {at: tavern, to: mags, text: "Did Kael rob Odo?", expect: none}
    - {at: tavern, to: mags, text: "Is it true that Kael beat Odo?", expect: none}
    - {at: tavern, to: odo, text: "Who robbed you?", expect: none}
    - {at: gate, to: brenna, text: "Would you take a bribe?", expect: none}
    - {at: gate, to: brenna, text: "What would 20 coins buy me?", expect: none}
    - {at: gate, to: brenna, text: "Did Kael tell you I robbed him?", expect: none}
    - {at: gate, to: brenna, text: "Kael offered you 20 coins, didn't he?", expect: none}
    # hypotheticals and maybes
    - {at: tavern, to: mags, text: "What if I told you Kael robbed Odo?", expect: none}
    - {at: tavern, to: mags, text: "Imagine if Kael robbed Odo. Wouldn't that be something?", expect: none}
    - {at: tavern, to: mags, text: "I could tell the Captain that Kael robbed Odo.", expect: none}
    - {at: tavern, to: mags, text: "Should I say Kael robbed Odo?", expect: none}
    - {at: gate, to: brenna, text: "If I had 20 coins I'd give them to you.", expect: none}
    - {at: gate, to: brenna, text: "Maybe I'll pay, maybe I won't.", expect: none}
    - {at: gate, to: brenna, text: "Suppose a traveller left 25 coins on your table.", expect: none}
    # denials and refusals: saying it never happened isn't an act this game has
    - {at: tavern, to: mags, text: "Kael never robbed Odo.", expect: none}
    - {at: tavern, to: mags, text: "Kael didn't insult you.", expect: none}
    - {at: tavern, to: mags, text: "Kael would never rob Odo.", expect: none}
    - {at: gate, to: brenna, text: "I never robbed Kael.", expect: none}
    - {at: gate, to: brenna, text: "I'm not paying you a single coin.", expect: none}
    - {at: gate, to: brenna, text: "I won't offer you 20 coins.", expect: none}
    - {at: tavern, to: kael, text: "You're no coward, Kael.", expect: none}
    - {at: tavern, to: kael, text: "I wouldn't call you a coward.", expect: none}
    # quotes and reports of what others said
    - {at: tavern, to: mags, text: "I heard Kael robbed Odo, but I don't believe it.", expect: none}
    - {at: tavern, to: mags, text: "People say Odo lied about Kael.", expect: [none, "tell_claim lied(odo, kael)"]}
    - {at: tavern, to: mags, text: "Odo says Kael robbed him.", expect: [none, "tell_claim robbed(kael, odo)"]}
    - {at: tavern, to: kael, text: "Odo called you a coward.", expect: [none, "tell_claim insulted(odo, kael)"]}
    - {at: tavern, to: mags, text: "\"Kael robbed Odo\" - that's what I'm supposed to say, isn't it?", expect: none}
    - {at: tavern, to: kael, text: "They say you're a coward. I don't believe it.", expect: none}
    - {at: gate, to: brenna, text: "Kael says I robbed him. He's lying.", expect: [none, "tell_claim lied(kael, player)"]}
    # sarcasm, praise and warnings in blunt words
    - {at: gate, to: brenna, text: "Oh sure, I'll pay you a thousand coins.", expect: none}
    - {at: gate, to: brenna, text: "Twenty coins? That's robbery.", expect: none}
    - {at: tavern, to: kael, text: "You're a hard man, Kael, I'll give you that.", expect: none}
    - {at: tavern, to: kael, text: "Careful, Kael. The Captain is watching you.", expect: none}
    - {at: tavern, to: kael, text: "Only a fool would cross blades with you.", expect: none}
    # coins, crimes and insults talked about, not done
    - {at: gate, to: brenna, text: "I paid you 20 coins yesterday.", expect: none}
    - {at: gate, to: brenna, text: "I've got 40 coins on me.", expect: none}
    - {at: tavern, to: mags, text: "Robbery is a hanging matter on this road, isn't it?", expect: none}
    - {at: tavern, to: mags, text: "Kael is a coward.", expect: none}
    - {at: gate, to: brenna, text: "You've a duty to keep the road moving, Captain.", expect: none}
    - {at: gate, to: brenna, text: "Let me through or you'll regret it.", expect: none}
    # people who aren't in the game, or nobody in particular
    - {at: tavern, to: mags, text: "The blacksmith robbed Odo.", expect: none}
    - {at: tavern, to: odo, text: "Someone robbed Kael, I hear.", expect: none}
    - {at: tavern, to: mags, text: "Kael robbed a merchant on the south road.", expect: none}
