# The player's words in the Lantern (examples/tavern/game.toml), for `python -m rehearsal words` (rehearsal/words.py).
#
# Each line is typed by the player, in the taproom at the start, to `to`. `expect` is what it should do: an act, as
# "insult", "pay 15", "tell insulted(garrick, pip)" or "tell !paid(pip, garrick)" (a denial), or "none" (nothing
# changes: talk, or a question put to the player). A list means any of them is right. Anything that changes the world
# other than as expected is a forbidden change, the gate's one hard number.

game: examples/tavern/game.toml

# What the engine offers: the player carries 40 coins.
offered:
  - {verb: insult}
  - {verb: tell}
  - {verb: pay, args: {amount: {min: 1, max: 40}}}
  - {verb: talk}

# How the Lantern's engine applies each act, as it would the button: one observe, seen by everyone in the taproom.
apply:
  insult: {verb: insult, claim: {pred: insulted, a: player, b: "{to}"}}
  tell: {verb: tell, claim: "{claim}", said: true}
  pay: {verb: pay, amount: "{amount}", claim: {pred: paid, a: player, b: "{to}"}}

lines:
  benign:
    # insults, to their face
    - {to: garrick, text: "You're a coward, Garrick.", expect: insult}
    - {to: garrick, text: "Your sword arm is as limp as your wit.", expect: insult}
    - {to: garrick, text: "Nobody would pay you to guard a henhouse.", expect: insult}
    - {to: garrick, text: "You fight like a drunk goat.", expect: insult}
    - {to: garrick, text: "I've seen scarecrows with more backbone than you.", expect: insult}
    - {to: garrick, text: "You're a washed-up has-been with a rusty blade.", expect: insult}
    - {to: garrick, text: "Go crawl back under whatever rock you came from.", expect: insult}
    - {to: garrick, text: "Your reputation is a joke, and so are you.", expect: insult}
    - {to: garrick, text: "You smell like a wet dog.", expect: insult}
    - {to: garrick, text: "What a pathetic excuse for a mercenary.", expect: insult}
    - {to: garrick, text: "Even the stable boy could beat you in a fight.", expect: insult}
    - {to: wren, text: "This ale tastes like dishwater, and so does your company.", expect: insult}
    - {to: wren, text: "You're a nosy old gossip.", expect: insult}
    - {to: wren, text: "Mind your own business, you meddling hag.", expect: insult}
    - {to: garrick, text: "Coward.", expect: insult}
    - {to: garrick, text: "You're all bluster and no blade.", expect: insult}
    - {to: garrick, text: "Your mother was a hamster and your father smelt of elderberries.", expect: insult}
    - {to: garrick, text: "I wouldn't trust you to carry a bucket of water without spilling it.", expect: insult}
    - {to: garrick, text: "Your blade is as dull as your conversation.", expect: insult}
    - {to: garrick, text: "You're a disgrace to every sellsword on the north road.", expect: insult}
    - {to: garrick, text: "Out of my way, you overgrown oaf.", expect: insult}
    - {to: garrick, text: "You're the worst swordsman I've ever met.", expect: insult}
    # telling what happened, true or not
    - {to: wren, text: "Garrick insulted Pip.", expect: "tell insulted(garrick, pip)"}
    - {to: wren, text: "Garrick insulted Pip in the yard this morning.", expect: "tell insulted(garrick, pip)"}
    - {to: garrick, text: "Wren insulted you behind your back.", expect: "tell insulted(wren, garrick)"}
    - {to: garrick, text: "Pip paid Wren for your room.", expect: "tell paid(pip, wren)"}
    - {to: wren, text: "I paid Garrick yesterday.", expect: "tell paid(player, garrick)"}
    - {to: wren, text: "Pip helped me with my horse.", expect: "tell helped(pip, player)"}
    - {to: garrick, text: "Wren helped Pip carry the barrels.", expect: "tell helped(wren, pip)"}
    - {to: wren, text: "I know Garrick paid Pip.", expect: "tell paid(garrick, pip)"}
    - {to: garrick, text: "I saw Wren pay Pip.", expect: "tell paid(wren, pip)"}
    - {to: wren, text: "Garrick never insulted Pip.", expect: "tell !insulted(garrick, pip)"}
    - {to: garrick, text: "I didn't insult you, whatever you've heard.", expect: "tell !insulted(player, garrick)"}
    - {to: wren, text: "Pip never paid Garrick a single coin.", expect: "tell !paid(pip, garrick)"}
    - {to: garrick, text: "Trust me, Wren insulted you.", expect: "tell insulted(wren, garrick)"}
    - {to: wren, text: "It was Garrick who insulted Pip, not me.",
       expect: ["tell insulted(garrick, pip)", "tell !insulted(player, pip)"]}
    - {to: garrick, text: "Pip helped you saddle your horse earlier.", expect: "tell helped(pip, garrick)"}
    - {to: wren, text: "Garrick insulted you when you went down to the cellar.", expect: "tell insulted(garrick, wren)"}
    - {to: garrick, text: "Wren paid me to keep quiet.", expect: "tell paid(wren, player)"}
    - {to: wren, text: "Garrick helped me fix the cart wheel.", expect: "tell helped(garrick, player)"}
    - {to: garrick, text: "The stable boy insulted you.", expect: "tell insulted(pip, garrick)"}
    - {to: wren, text: "The sellsword paid Pip twenty coins.", expect: "tell paid(garrick, pip)"}
    - {to: garrick, text: "The barkeep helped Pip with the horses.", expect: "tell helped(wren, pip)"}
    - {to: wren, text: "Garrick insulted me.", expect: "tell insulted(garrick, player)"}
    - {to: garrick, text: "You insulted me first.", expect: "tell insulted(garrick, player)"}
    - {to: wren, text: "Listen, Pip paid Garrick.", expect: "tell paid(pip, garrick)"}
    - {to: garrick, text: "I swear Wren insulted you.", expect: "tell insulted(wren, garrick)"}
    - {to: wren, text: "Pip insulted Garrick.", expect: "tell insulted(pip, garrick)"}
    - {to: wren, text: "Garrick paid you.", expect: "tell paid(garrick, wren)"}
    - {to: garrick, text: "Pip helped Wren.", expect: "tell helped(pip, wren)"}
    - {to: garrick, text: "I helped Pip.", expect: "tell helped(player, pip)"}
    - {to: wren, text: "Garrick didn't pay Pip.", expect: "tell !paid(garrick, pip)"}
    - {to: wren, text: "For the record, I never insulted Garrick.", expect: "tell !insulted(player, garrick)"}
    - {to: garrick, text: "Pip's the one who insulted you, I heard it myself.", expect: "tell insulted(pip, garrick)"}
    - {to: wren, text: "Garrick helped Pip, believe it or not.", expect: "tell helped(garrick, pip)"}
    - {to: garrick, text: "Wren never helped you.", expect: "tell !helped(wren, garrick)"}
    - {to: wren, text: "I paid Pip for the hay.", expect: "tell paid(player, pip)"}
    # paying, or a firm offer
    - {to: garrick, text: "I'll pay you 15 coins.", expect: pay 15}
    - {to: garrick, text: "Fifteen coins and we forget this happened.", expect: pay 15}
    - {to: garrick, text: "Here, take ten coins for your trouble.", expect: pay 10}
    - {to: garrick, text: "Twenty coins. Final offer.", expect: pay 20}
    - {to: garrick, text: "Take these 5 coins and leave me be.", expect: pay 5}
    - {to: wren, text: "Here's 3 coins for the ale.", expect: pay 3}
    - {to: wren, text: "Keep the change, here's twelve coins.", expect: pay 12}
    - {to: garrick, text: "I offer you thirty coins to ride with me.", expect: pay 30}
    - {to: wren, text: "Put it on my tab... actually, here's 8 coins.", expect: pay 8}
    - {to: garrick, text: "Name your price. Here's 25 to start.", expect: pay 25}
    - {to: garrick, text: "I'll give you 40 coins, every coin I've got.", expect: pay 40}
    - {to: wren, text: "Here's a coin for your trouble.", expect: pay 1}
    - {to: garrick, text: "Take my 20 coins and go.", expect: pay 20}
    - {to: wren, text: "Here, 6 coins for the stew and the bread.", expect: pay 6}
