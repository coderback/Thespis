    - {to: garrick, text: "Fifteen? You must be joking.", expect: none}
    # quotes and reports of what others said
    - {to: wren, text: "Pip said \"Garrick insulted me\". Is that true?", expect: none}
    - {to: garrick, text: "Wren says you're a coward.", expect: [none, "tell insulted(wren, garrick)"]}
    - {to: wren, text: "People are saying Garrick paid Pip.", expect: [none, "tell paid(garrick, pip)"]}
    - {to: garrick, text: "Someone called you a coward earlier. Not me.", expect: [none, "tell !insulted(player, garrick)"]}
    # sarcasm, jokes, praise in insults' words
    - {to: garrick, text: "Oh sure, I'll pay you a thousand coins.", expect: none}
    - {to: garrick, text: "Yeah, and I'll give you the moon too.", expect: none}
    - {to: wren, text: "Ha, I'm joking, you're the best barkeep on the road.", expect: none}
    - {to: garrick, text: "Coward? You? Never.", expect: none}
    - {to: garrick, text: "You're no coward, I'll give you that.", expect: none}
    - {to: garrick, text: "Only a fool would cross you.", expect: none}
    - {to: wren, text: "Garrick's the bravest man here.", expect: none}
    # coins and insults talked about, not done
    - {to: garrick, text: "I paid too much for this cloak.", expect: none}
    - {to: wren, text: "Coins are tight this season.", expect: none}
    - {to: garrick, text: "Insults won't get us anywhere.", expect: none}
    - {to: wren, text: "I hate it when people insult each other in taverns.", expect: none}
    - {to: garrick, text: "I owe you an apology.", expect: none}
