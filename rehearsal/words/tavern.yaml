    - {to: wren, text: "Lovely fire you've got going.", expect: none}
    - {to: wren, text: "Have you seen a man in a grey cloak?", expect: none}
    - {to: garrick, text: "Good evening.", expect: none}
    - {to: wren, text: "Thanks for the ale.", expect: none}
    - {to: garrick, text: "How far to the next town?", expect: none}
    - {to: wren, text: "I'll just sit by the window for a while.", expect: none}
    - {to: garrick, text: "Tell me about the north road.", expect: none}
    - {to: wren, text: "Busy night?", expect: none}
    - {to: garrick, text: "I mean you no harm.", expect: none}
    - {to: garrick, text: "Let's not fight.", expect: none}
    - {to: wren, text: "What do you know about Garrick?", expect: none}
    - {to: wren, text: "Where's Pip got to?", expect: none}
    - {to: garrick, text: "I'm heading north too, at dawn.", expect: none}
    - {to: wren, text: "Hello!", expect: none}
    - {to: wren, text: "The horses in the yard look well cared for.", expect: none}
    - {to: garrick, text: "Do you want to share a table?", expect: none}
    - {to: wren, text: "Goodnight, Wren.", expect: none}
    - {to: garrick, text: "Safe travels.", expect: none}
    - {to: wren, text: "Any news from the south?", expect: none}
    - {to: garrick, text: "I've heard good things about you.", expect: none}

  hard:
    # questions
    - {to: wren, text: "Did Garrick insult Pip?", expect: none}
    - {to: garrick, text: "Did Wren really insult you?", expect: none}
    - {to: wren, text: "Was it Pip who paid Garrick?", expect: none}
    - {to: wren, text: "Who insulted Pip?", expect: none}
    - {to: wren, text: "Didn't Garrick insult Pip?", expect: none}
    - {to: wren, text: "Would ten coins cover the room?", expect: none}
    - {to: garrick, text: "Do you want money? Is that it?", expect: none}
    - {to: wren, text: "How much is a room?", expect: none}
    - {to: wren, text: "Do you take silver, or only coin?", expect: none}
    # hypotheticals and maybes
    - {to: garrick, text: "What if I said Wren insulted you?", expect: none}
    - {to: garrick, text: "If I paid you 20 coins, would you leave?", expect: none}
    - {to: garrick, text: "Suppose I offered you fifteen coins.", expect: none}
    - {to: wren, text: "Imagine Garrick insulted Pip. What then?", expect: none}
    - {to: garrick, text: "I could insult you, but I won't.", expect: none}
    - {to: garrick, text: "I might pay you later.", expect: none}
    - {to: wren, text: "Maybe I'll pay Pip tomorrow.", expect: none}
    - {to: wren, text: "Garrick will probably insult someone tonight.", expect: none}
    - {to: garrick, text: "One day someone will call you a coward to your face.", expect: none}
