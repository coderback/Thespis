    - {to: garrick, text: "Here's 18 coins. We're square.", expect: pay 18}
    - {to: wren, text: "Seven coins, and keep the ale coming.", expect: pay 7}
    - {to: garrick, text: "I'm paying you 22 coins, take it.", expect: pay 22}
    # talk
    - {to: wren, text: "What's good to eat tonight?", expect: none}
    - {to: wren, text: "Is there a room free?", expect: none}
    - {to: garrick, text: "Which road are you taking north?", expect: none}
