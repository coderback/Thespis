<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/HorizontalTiltShiftShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VerticalTiltShiftShader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
  const Q = new URLSearchParams(location.search), MODE = Q.get("mode") || "town", DUMP = Q.has("dump");
  const W = 1920, H = 1080;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if (!DUMP) document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x120c08);
  const camera = new THREE.PerspectiveCamera(26, W / H, 0.5, 300);
  camera.position.set(37, 27, 45); camera.lookAt(1.5, -1.6, 0.4);

  let seed = 1898; const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const srgb = (t) => { t.encoding = THREE.sRGBEncoding; return t; };
  function tex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); return srgb(new THREE.CanvasTexture(c)); }
  const std = (o) => new THREE.MeshStandardMaterial(o);

  // ---------- light ----------
  scene.add(new THREE.HemisphereLight(0x3a5578, 0x1a120c, 0.4));
  const lamp = new THREE.SpotLight(0xffc48a, 0.95, 160, 0.7, 0.85, 1.2);
  lamp.position.set(-34, 42, 18); lamp.target.position.set(0, -2, 0); lamp.castShadow = true;
  lamp.shadow.mapSize.set(2048, 2048); lamp.shadow.bias = -0.0006; scene.add(lamp, lamp.target);
  const fill = new THREE.DirectionalLight(0xffd2a0, 0.3); fill.position.set(40, 6, 30); scene.add(fill);
  const moon = new THREE.DirectionalLight(0x8aa6cf, 0.38); moon.position.set(20, 30, -30); scene.add(moon);

  // ---------- desk ----------
  const wood = tex(1024, 1024, (g, w, h) => {
    g.fillStyle = "#3a2618"; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 2) { const v = Math.sin(y * 0.05 + Math.sin(y * 0.013) * 4) * 0.5 + 0.5; g.fillStyle = `rgba(${20 + v * 30},${12 + v * 18},${6 + v * 10},${0.35 + rand() * 0.2})`; g.fillRect(0, y, w, 2); }
    for (let i = 0; i < 40; i++) { g.strokeStyle = `rgba(15,8,4,${0.15 + rand() * 0.2})`; g.lineWidth = 1 + rand() * 2; g.beginPath(); const y = rand() * h; g.moveTo(0, y); for (let x = 0; x < w; x += 40) g.lineTo(x, y + Math.sin(x * 0.01 + i) * 10); g.stroke(); }
  });
  wood.wrapS = wood.wrapT = THREE.RepeatWrapping; wood.repeat.set(6, 6); wood.rotation = 0.08;
  const desk = new THREE.Mesh(new THREE.PlaneGeometry(420, 420), std({ map: wood, roughness: 0.55, metalness: 0.05 }));
  desk.rotation.x = -Math.PI / 2; desk.position.y = -4.6; desk.receiveShadow = true; scene.add(desk);

  // ---------- plinth ----------
  const PW = 34, PD = 27, PH = 4.6;
  function earth(g, w, h, riverFrom, riverTo) {
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, "#e9eef3"); grd.addColorStop(0.08, "#dfe6ee"); grd.addColorStop(0.1, "#4a3a2c");
    grd.addColorStop(0.45, "#3a2d22"); grd.addColorStop(0.62, "#5f6b78"); grd.addColorStop(0.7, "#4c5866"); grd.addColorStop(1, "#2b241e");
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 500; i++) { const y = h * (0.12 + rand() * 0.86); g.fillStyle = `rgba(${150 + rand() * 60},${140 + rand() * 50},${120 + rand() * 40},${0.25 + rand() * 0.35})`; const r = 1 + rand() * 4; g.beginPath(); g.arc(rand() * w, y, r, 0, 7); g.fill(); }
    for (let i = 0; i < 30; i++) { g.strokeStyle = "rgba(200,220,235,.25)"; g.beginPath(); const y = h * (0.6 + rand() * 0.12); g.moveTo(rand() * w, y); g.lineTo(rand() * w, y + (rand() - 0.5) * 6); g.stroke(); }
    if (riverFrom != null) {
      const a = riverFrom * w, b = riverTo * w;
      g.fillStyle = "#0e1824"; g.fillRect(a, 0, b - a, h * 0.55);
      const ice = g.createLinearGradient(0, 0, 0, h * 0.2); ice.addColorStop(0, "#f2f7fb"); ice.addColorStop(1, "#9fc0dc");
      g.fillStyle = ice; g.fillRect(a, 0, b - a, h * 0.2);
      g.strokeStyle = "rgba(60,90,120,.6)"; g.lineWidth = 2; for (let i = 0; i < 8; i++) { const x = a + rand() * (b - a); g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (rand() - 0.5) * 30, h * 0.2); g.stroke(); }
    }
  }
  const front = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), std({ map: tex(1024, 96, (g, w, h) => earth(g, w, h)), roughness: 0.95 }));
  front.position.set(0, -PH / 2, PD / 2); front.receiveShadow = true; scene.add(front);
  const zToU = (z) => (z + PD / 2) / PD;
  const east = new THREE.Mesh(new THREE.PlaneGeometry(PD, PH), std({ map: tex(1024, 96, (g, w, h) => earth(g, w, h, zToU(-6.5), zToU(-0.7))), roughness: 0.9 }));
  east.rotation.y = Math.PI / 2; east.position.set(PW / 2, -PH / 2, 0); east.receiveShadow = true; scene.add(east);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(PW + 0.3, 0.25, PD + 0.3), std({ color: 0x2a1c12, roughness: 0.6 }));
  lip.position.set(0, -PH - 0.05, 0); scene.add(lip);
  // brass plaque on the front of the plinth
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(7, 1.0), std({ map: tex(700, 100, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, "#c9a14a"); gr.addColorStop(0.5, "#e8c97a"); gr.addColorStop(1, "#a07a2a"); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = "#5a4010"; g.lineWidth = 4; g.strokeRect(8, 8, w - 16, h - 16);
    g.fillStyle = "#3a2808"; g.font = "bold 44px Georgia"; g.textAlign = "center"; g.fillText("COLDWATER LANDING · 1898", w / 2, 66);
  }), metalness: 0.55, roughness: 0.35 }));
  plaque.position.set(-3, -2.5, PD / 2 + 0.02); scene.add(plaque);

  // ---------- ground ----------
  const snow = tex(512, 512, (g, w, h) => { g.fillStyle = "#cdd6e1"; g.fillRect(0, 0, w, h); for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(130,150,185,${rand() * 0.12})`; g.fillRect(rand() * w, rand() * h, 2 + rand() * 9, 1 + rand() * 2); } for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(255,255,255,${rand() * 0.5})`; g.fillRect(rand() * w, rand() * h, 1, 1); } });
  snow.wrapS = snow.wrapT = THREE.RepeatWrapping; snow.repeat.set(5, 4);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(PW, PD), std({ map: snow, roughness: 0.92 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  // decal layer: trampled tracks drawn on a canvas covering the whole top (60 px per unit)
  const DS = 60, DW = PW * DS, DH = PD * DS, U = (x) => (x + PW / 2) * DS, V = (z) => (z + PD / 2) * DS;
  const decalCanvas = document.createElement("canvas"); decalCanvas.width = DW; decalCanvas.height = DH;
  const dg = decalCanvas.getContext("2d");
  function trample(x0, z0, x1, z1, width, n) {
    for (let i = 0; i < n; i++) { const t = rand(), x = x0 + (x1 - x0) * t, z = z0 + (z1 - z0) * t, ox = (rand() - 0.5) * width, oz = (rand() - 0.5) * width;
      const dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz) || 1, nx = -dz / L, nz = dx / L, off = (rand() - 0.5) * width;
      dg.fillStyle = `rgba(${95 + rand() * 30},${105 + rand() * 25},${130 + rand() * 25},${0.05 + rand() * 0.08})`;
      dg.beginPath(); dg.ellipse(U(x + nx * off), V(z + nz * off), 4 + rand() * 10, 2 + rand() * 5, Math.atan2(dz, dx), 0, 7); dg.fill(); }
  }
  trample(-16.5, 7.6, 16, 7.6, 2.0, 5000);          // the street
  trample(0.15, 6.5, 0.15, 2.0, 0.7, 700);          // the lane down to the landing
  trample(12.4, 7.8, 12.4, 9.9, 1.0, 400);          // to the infirmary
  trample(8.4, 6.5, 8.4, 7.6, 0.8, 200);
  dg.strokeStyle = "rgba(80,95,125,.35)"; dg.lineWidth = 2;   // sled runners along the street
  [7.2, 7.55, 8.0, 8.32].forEach((z) => { dg.beginPath(); for (let x = -16.5; x <= 16.5; x += 0.5) { const zz = z + Math.sin(x * 0.4 + z) * 0.06; x === -16.5 ? dg.moveTo(U(x), V(zz)) : dg.lineTo(U(x), V(zz)); } dg.stroke(); });
  const decal = new THREE.Mesh(new THREE.PlaneGeometry(PW, PD), std({ map: srgb(new THREE.CanvasTexture(decalCanvas)), transparent: true, depthWrite: false, roughness: 0.95 }));
  decal.rotation.x = -Math.PI / 2; decal.position.y = 0.012; decal.receiveShadow = true; scene.add(decal);

  // the frozen river
  const ice = tex(1024, 160, (g, w, h) => {
    g.fillStyle = "#b4c7da"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 160; i++) { g.strokeStyle = `rgba(60,85,115,${0.15 + rand() * 0.35})`; g.beginPath(); let x = rand() * w, y = rand() * h; g.moveTo(x, y); for (let k = 0; k < 4; k++) { x += (rand() - 0.5) * 50; y += (rand() - 0.5) * 14; g.lineTo(x, y); } g.stroke(); }
    for (let i = 0; i < 110; i++) { g.fillStyle = `rgba(236,242,250,${0.2 + rand() * 0.6})`; g.beginPath(); g.ellipse(rand() * w, rand() * h, 6 + rand() * 50, 1 + rand() * 6, (rand() - 0.5) * 0.3, 0, 7); g.fill(); }
  });
  const river = new THREE.Mesh(new THREE.PlaneGeometry(PW, 5.8), std({ map: ice, roughness: 0.25, metalness: 0.05 }));
  river.rotation.x = -Math.PI / 2; river.position.set(0, 0.025, -3.6); river.receiveShadow = true; scene.add(river);

  // ---------- routes (needed early so trees keep clear of them) ----------
  const TAKEN = [[0.6, 7.2], [0.15, 6.2], [0.12, 4.6], [0.15, 2.6], [0.2, 1.0], [0.25, -0.9], [1.4, -2.0], [3.4, -3.0], [5.3, -4.9], [7.5, -6.6], [9.0, -7.7], [9.5, -8.0]];
  const BACKWAY = [[0.6, 7.2], [-1.2, 8.5], [-8, 8.7], [-14.4, 8.0], [-15.6, 5.0], [-15.6, 1.0], [-15.2, -3.6], [-14.4, -7.6], [-10.5, -9.0], [-4.5, -8.7], [1.5, -9.4], [6.5, -9.0], [8.6, -8.4], [9.5, -8.0]];
  const nearRoute = (x, z, pts, r) => { for (let i = 0; i < pts.length - 1; i++) { const [ax, az] = pts[i], [bx, bz] = pts[i + 1], dx = bx - ax, dz = bz - az, t = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz))); if (Math.hypot(x - ax - dx * t, z - az - dz * t) < r) return true; } return false; };

  // ---------- snowbanks along the river ----------
  const drift = std({ color: 0xdfe6ee, roughness: 0.95 }), sph = new THREE.SphereGeometry(1, 12, 8);
  function mound(x, z, sx, sy, sz, y = 0) { const m = new THREE.Mesh(sph, drift); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.receiveShadow = true; m.castShadow = sy > 0.2; scene.add(m); }
  for (let x = -16.4; x <= 16.4; x += 0.7) {
    if (!(x > -0.8 && x < 1.2) && !(x > -16 && x < -14.6)) mound(x + rand() * 0.3, -0.75 + rand() * 0.15, 0.6 + rand() * 0.4, 0.18 + rand() * 0.14, 0.35 + rand() * 0.15);
    if (!(x > 6.6 && x < 8.6) && !(x > -16 && x < -13.6)) mound(x + rand() * 0.3, -6.45 - rand() * 0.15, 0.6 + rand() * 0.4, 0.18 + rand() * 0.14, 0.35 + rand() * 0.15);
  }
  for (let i = 0; i < 26; i++) { const x = (rand() - 0.5) * 30, z = -1.4 - rand() * 4.4; if (Math.hypot(x - 4.6, z + 3.8) > 1.6 && !nearRoute(x, z, TAKEN, 0.7) && !(x < -2.5 && x > -12.8 && z > -3.8)) mound(x, z, 0.5 + rand() * 0.9, 0.05 + rand() * 0.05, 0.2 + rand() * 0.3, 0.02); }

  // ---------- black spruce, instanced ----------
  const trees = [];
  for (let i = 0; i < 190; i++) {
    const x = (rand() - 0.5) * (PW - 1.6), z = (rand() - 0.5) * (PD - 1.6);
    const inRiver = z > -7.3 && z < 0.3, inTown = x > -15 && x < 15.5 && z > 0 && z < 12.2, nearVera = Math.hypot(x - 10, z + 10) < 3.2;
    if (!inRiver && !inTown && !nearVera && !nearRoute(x, z, BACKWAY, 0.75)) trees.push([x, z, 0.6 + rand() * 0.65, rand() * 6.28]);
  }
  const TIERS = 6, green = std({ color: 0xffffff, roughness: 1, flatShading: true }), white = std({ color: 0xe6ecf3, roughness: 1, flatShading: true });
  const trunkM = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.08, 0.11, 0.6, 6), std({ color: 0x2a1d14, roughness: 1 }), trees.length);
  const tierMeshes = [];
  for (let k = 0; k < TIERS; k++) {
    const r = 0.95 * (1 - k / (TIERS + 0.6)) + 0.1, gG = new THREE.ConeGeometry(r, 0.95, 8), sG = new THREE.ConeGeometry(r * 0.78, 0.42, 8);
    const gm = new THREE.InstancedMesh(gG, green, trees.length), sm = new THREE.InstancedMesh(sG, white, trees.length);
    gm.castShadow = sm.castShadow = true; gm.receiveShadow = sm.receiveShadow = true; tierMeshes.push([gm, sm, 0.75 + k * 0.5]);
  }
  const tip = new THREE.InstancedMesh(new THREE.ConeGeometry(0.12, 0.5, 6), green, trees.length); tip.castShadow = true;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), sV = new THREE.Vector3(), pV = new THREE.Vector3(), col = new THREE.Color();
  trees.forEach(([x, z, s, ry], i) => {
    q.setFromEuler(e.set(0, ry, 0)); sV.set(s, s * (0.9 + rand() * 0.25), s);
    m4.compose(pV.set(x, 0.3 * s, z), q, sV); trunkM.setMatrixAt(i, m4);
    col.setHSL(0.4 + rand() * 0.04, 0.28 + rand() * 0.1, 0.13 + rand() * 0.05);
    tierMeshes.forEach(([gm, sm, y]) => { m4.compose(pV.set(x, y * sV.y, z), q, sV); gm.setMatrixAt(i, m4); gm.setColorAt(i, col); m4.compose(pV.set(x, (y + 0.2) * sV.y, z), q, sV); sm.setMatrixAt(i, m4); });
    m4.compose(pV.set(x, (0.75 + TIERS * 0.5) * sV.y, z), q, sV); tip.setMatrixAt(i, m4); tip.setColorAt(i, col);
  });
  scene.add(trunkM, tip); tierMeshes.forEach(([gm, sm]) => scene.add(gm, sm));

  // ---------- buildings ----------
  const logMats = ["#5a3e28", "#4e3522", "#64462d", "#563b26"].map((c) => std({ color: c, roughness: 0.95, flatShading: true }));
  const chink = std({ color: 0x2a1d14, roughness: 1 }), darkMat = std({ color: 0x241d18, roughness: 1 }), metal = std({ color: 0x1d1b1a, roughness: 0.6, metalness: 0.4 });
  const roofWood = std({ color: 0x3a2a1e, roughness: 1 }), roofSnow = std({ color: 0xe9eef4, roughness: 0.9 }), icicleM = std({ color: 0xdbe8f5, roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.9 });
  const plankTex = (base, vertical) => { const t = tex(128, 128, (g, w, h) => { g.fillStyle = base; g.fillRect(0, 0, w, h); for (let i = 0; i < w; i += 16) { g.fillStyle = `rgba(0,0,0,${0.08 + rand() * 0.12})`; vertical ? g.fillRect(i, 0, 16, h) : g.fillRect(0, i, w, 16); g.fillStyle = "rgba(0,0,0,.45)"; vertical ? g.fillRect(i + 15, 0, 1, h) : g.fillRect(0, i + 15, w, 1); } }); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; };
  const chimneys = [];
  function cabin(o) {
    const g = new THREE.Group(), { w, d, h } = o, r = 0.11, rows = Math.round(h / (2 * r * 0.92)), rh = d * 0.4, ov = 0.28;
    const core = new THREE.Mesh(new THREE.BoxGeometry(w - 0.06, h, d - 0.06), o.white ? std({ map: plankTex("#cfd3d2", false), roughness: 0.95 }) : chink);
    core.position.y = h / 2; core.castShadow = core.receiveShadow = true; g.add(core);
    if (o.white) { core.material.map.repeat.set(w / 1.2, h / 1.2); }
    else {
      const lx = new THREE.CylinderGeometry(r, r, w + 0.34, 7), lz = new THREE.CylinderGeometry(r, r, d + 0.34, 7);
      for (let k = 0; k < rows; k++) {
        const y = r + k * 2 * r * 0.92;
        [1, -1].forEach((s) => {
          const a = new THREE.Mesh(lx, logMats[(k + (s > 0 ? 0 : 2)) % 4]); a.rotation.z = Math.PI / 2; a.position.set(0, y, s * (d / 2 - 0.02)); a.castShadow = a.receiveShadow = true; g.add(a);
          const b = new THREE.Mesh(lz, logMats[(k + (s > 0 ? 1 : 3)) % 4]); b.rotation.x = Math.PI / 2; b.position.set(s * (w / 2 - 0.02), y + r * 0.92, 0); b.castShadow = b.receiveShadow = true; g.add(b);
        });
      }
    }
    // gables
    const tri = new THREE.Shape(); tri.moveTo(-d / 2, 0); tri.lineTo(d / 2, 0); tri.lineTo(0, rh); tri.lineTo(-d / 2, 0);
    const gable = new THREE.ExtrudeGeometry(tri, { depth: 0.16, bevelEnabled: false });
    [1, -1].forEach((s) => { const m = new THREE.Mesh(gable, o.white ? core.material : logMats[1]); m.rotation.y = Math.PI / 2; m.position.set(s * (w / 2) - (s > 0 ? 0.16 : 0) + (s > 0 ? 0.06 : -0.06), h, 0); if (s < 0) m.position.x = -w / 2 - 0.06; else m.position.x = w / 2 - 0.1; m.castShadow = true; g.add(m); });
    // roof slabs with a snow layer and icicles at the front eave
    const a = Math.atan2(rh, d / 2), L = (d / 2 + ov) / Math.cos(a);
    [1, -1].forEach((s) => {
      const eave = new THREE.Vector3(0, h + rh - (d / 2 + ov) * Math.tan(a), s * (d / 2 + ov)), ridge = new THREE.Vector3(0, h + rh + 0.02, 0), mid = eave.clone().add(ridge).multiplyScalar(0.5);
      const th = s * a, nrm = new THREE.Vector3(0, Math.cos(th), Math.sin(th));
      const slab = new THREE.Mesh(new THREE.BoxGeometry(w + 0.6, 0.08, L), roofWood); slab.rotation.x = th; slab.position.copy(mid); slab.castShadow = true; g.add(slab);
      const sn = new THREE.Mesh(new THREE.BoxGeometry(w + 0.66, 0.2, L + 0.06), roofSnow); sn.rotation.x = th; sn.position.copy(mid).addScaledVector(nrm, 0.14); sn.castShadow = sn.receiveShadow = true; g.add(sn);
      if (s > 0) for (let x = -w / 2 - 0.2; x < w / 2 + 0.25; x += 0.16 + rand() * 0.12) { const len = 0.08 + rand() * 0.32, ic = new THREE.Mesh(new THREE.ConeGeometry(0.028, len, 4), icicleM); ic.rotation.x = Math.PI; ic.position.set(x, eave.y - len / 2 - 0.02, eave.z + 0.02); g.add(ic); }
    });
    // door, step, windows with mullions and a snowy sill
    const doorM = std({ map: plankTex("#3b2a1d", true), roughness: 1 });
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.08, 0.06), doorM); door.position.set(o.doorX || 0, 0.54, d / 2 + 0.1); g.add(door);
    const step = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.1, 0.4), roofWood); step.position.set(o.doorX || 0, 0.05, d / 2 + 0.3); g.add(step);
    const winMat = std({ color: 0x1a1410, emissive: 0xffb35a, emissiveIntensity: o.lit ? 1.3 : 0 });
    (o.windows || []).forEach((wx) => {
