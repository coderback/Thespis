# The Crypt Road cast: starting state and personas, from the Cast section of docs/crypt-road-v2.md.
# Persona lines go word for word into the model's state pack. The [npc.*.lines] tables are the fallback brain's
# lines, keyed by trigger; the quoted sample lines come from the design doc. {placeholders} are filled in code.
# Drives run 0 to 10; trust runs -5 to 5.

[npc.kael]
name = "Kael"
start = "tavern"
goal = "Take the relic"
persona = "A sellsword with a reputation to protect: proud, quick to anger and slow to forgive. He speaks in short, cutting sentences and never forgets a slight."
drives = { grudge = 0, fear = 1, respect = 1, ambition = 6 }
trust_in = {}

[npc.brenna]
name = "Captain Brenna"
start = "guard_post"
goal = "Keep the road orderly"
persona = "Captain of the bridge watch: dutiful, tired and practical. She believes people she trusts, and a fine paid in coin smooths most trouble."
drives = {}
trust_in = { player = 0, kael = 2, odo = 2, mags = 1 }

[npc.mags]
name = "Mags"
start = "tavern"
goal = "Keep the tavern calm"
persona = "Innkeeper of the Lantern & Last Coin: warm, nosy, and misses nothing under her roof. She trades gossip like coin."
drives = {}
trust_in = { player = 0, kael = 0 }

[npc.odo]
name = "Odo"
start = "tavern"
goal = "Sell goods, avoid trouble"
persona = "A travelling peddler who walks this road every day: nervous, honest to a fault and eager to avoid trouble. Ask and he'll tell you what he saw."
drives = {}
trust_in = { player = 0, kael = 0 }
# His stop by time of day: morning, noon, evening, night. The only schedule in the game.
walk = ["tavern", "market", "guard_post", "market"]

[narrator]
name = "The Dungeon Master"
persona = "A wry storyteller who recounts only what the ledger shows and ends every telling with a hook."

# ---------------------------------------------------------------- fallback lines (#10)
[npc.kael.lines]
insulted = "Say that again, stranger, and we settle it with steel."
beaten = "Lucky blade. It won't happen twice."
victor = "Stay down. The relic is mine."
robbed = "Laugh now. The road is long."
spared = "A fair fight. I'll remember that."
leaving = "Out of my way."
accuse_robbed = "Captain. The rogue in green robbed me at the Lantern."
accuse_beat = "Captain. The rogue in green set on me at the Lantern."
reported = "Told the Captain what you did in the tavern. Enjoy the view."
grudge_meet = "You'll answer for the tavern."
share_drink = "Sit. One drink, for a fair fight. A tip: the Captain believes whoever she trusts."
lied_about = "Liar! I never touched {victim}!"
talk = "Speak quickly. I have a road to run."
told = "Save your stories."

[npc.brenna.lines]
arrival_robbed = "{source} says you cut his purse in the tavern. You're not crossing."
arrival_beat = "{source} says you beat him bloody. You're not crossing."
arrival = "State your business, traveller."
bribe = "For {amount} coins, I was looking the other way."
counter = "{offer} coins? Make it {price}, and I never saw you."
refuse = "Keep your {offer} coins, before I add bribery to the charge."
told_believed = "Is that so? I'll see to it."
told_doubted = "I don't know you well enough to take your word."
detain = "{culprit} robbed {victim}, did he? Sergeant, hold him."
question = "{witness}. Is it true you were robbed?"
talk_distrust = "No one crosses while I doubt them."
talk = "Keep moving, and keep out of trouble."
insulted = "Careful. I've locked up men for less."

[npc.mags.lines]
talk_robbed = "Odo saw the whole thing, and Odo talks."
talk_grudge = "Kael won't forget that, love. That one keeps a list."
talk = "What'll it be, love?"
told = "Is that so? I'll keep it in mind, love."
insulted = "Mind your manners under my roof."

[npc.odo.lines]
talk_saw = "I saw nothing! Well. I saw the purse."
talk = "Fine wares, fair prices!"
told = "Oh! Is that so? Dear me."
testify = "Robbed? Me? By {culprit}? Captain, I've never been robbed in my life."
insulted = "No need for that, friend. No need at all."

# What each event was, in words: the digest says them to the player, and state packs say them about the player.
# {a} is the actor and {t} the target, {where} the stop it happened at, {to} where someone walked; words.py fills them.
[words.events]
insult = "{a} insulted {t} at {where}."
challenge = "{a} challenged {t} to a duel."
beat = "{a} beat {t} in the duel."
humiliate = "{a} humiliated {t} and took {purse} purse."
spare = "{a} spared {t}."
bribe = "{a} paid {t} {amount} coins."
bribe_fine = "{a} paid {t} a fine."
offer = "{a} offered {t} {amount} coins."
counter = "{a} asked {t} for {amount} coins."
refuse = "{a} turned down {whose} offer."
move = "{a} walked from {where} to {to}."
block = "{guard} turned {actor} back at the gate."
detain = "{a} detained {t}."
release = "{a} released {t}."
testify = "{a} told {t} that {denied}."
take_relic = "{a} took the relic."
told = "{a} told {t} that {claim}."  # tell_claim, accuse and gossip: anything that carries a claim

# What each action does, for the model's DOING, by the action's kind. {next} is the next stop, {who} whom it names.
[actions]
go_to = "walk on towards the relic, to {next}"
go_to_end = "walk on"
wait = "stay where you are and do nothing this phase"
take_relic = "take the relic and win the race"
accuse = "tell the Captain what the player did to you; she trusts you and will stop them at the gate"
share_drink = "stay this phase to share a drink with the player and tell them something useful"
detain = "have the sergeant hold {who} for two phases"
question = "ask {who} whether the claim about them is true"
counter = "name your price: {who} coins, and not a coin less"
refuse = "turn the offer down and hear no more offers for now"

# The claim extractor's vocabulary (thespis.claims): the predicates, characters and places it may use.
[claims]
description = "Predicates (a and b are ids):\n- insulted(a, b); beat(a, b): a beat b in a duel; robbed(a, b): a robbed b or took b's purse; spared(a, b); lied(a, b): a lied about b\n- went_to(a, place); at(a, place): a is at place now; told(a, b): a told b something (a report, gossip or testimony); detained(a, b); paid(a, b): a paid b a fine or a bribe; took_relic(a, relic)\n- other: any other assertion about what happened, with b set to a short paraphrase\nCharacters: player (the one being spoken to, \"you\"), kael, brenna (the Captain), mags, odo. Places: tavern, market, guard_post, bridge, crypt."
